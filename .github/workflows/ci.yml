name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 앞선 실행은 취소한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 버전을 여기 적지 않는다. package.json의 packageManager를 읽는다
      - uses: pnpm/action-setup@v4

      # 캐시가 pnpm 스토어를 참조하므로 pnpm 설치 뒤에 와야 한다
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # README의 완료 기준 게이트 3종과 같은 순서
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:run

      # 게이트에는 없지만 배포가 빌드에 의존하므로 함께 확인한다
      - run: pnpm build
